function renderStory(){setView(head('THE WHOLE STORY','故事精读','先读连贯的主线，再按阶段展开。这里解释每一次靠近、分离与选择如何改变后面的故事。')+`<div class="panel flow-text">${D.canon.synopsis.map(p=>`<p>${rich(p)}</p>`).join('')}${refs(D.canon.synopsisRefs,12)}</div>`+section('主线分阶段','每段都保留前因、转折与结局')+D.canon.stages.map((s,i)=>`<article class="story-block"><aside class="story-side"><strong>${String(i+1).padStart(2,'0')}</strong>${esc(s.period||'')}${s.range?'<br>第 '+s.range[0]+'–'+s.range[1]+' 章':''}</aside><div class="story-copy"><h3>${esc(s.title)}</h3><p>${rich(s.text)}</p>${s.people?names(s.people):''}${refs(s.refs,9)}</div></article>`).join('')+section('逐段延伸','分段精读保留更多支线和日常生活的变化')+D.arcs.filter(a=>a.layer==='main').map(a=>`<details class="panel" style="margin-bottom:12px"><summary><strong>${esc(a.title)}</strong> <span class="small muted">${a.range?.map(k=>unitLabel(k)).join('—')||''}</span></summary><div class="flow-text" style="margin-top:16px">${rich(a.summary)}</div>${a.turningPoints?.length?'<ul class="small">'+a.turningPoints.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':''}${refs(a.refs,12)}</details>`).join(''));}
function personCard(p){let fate=p.fate;return `<article class="panel person-card" data-cmd="person" data-id="${p.id}"><div class="card-star">${star('person',p.id)}</div><div class="person-top"><div class="monogram">${esc(p.name.slice(0,1))}</div><div><h3><button class="text-btn" style="font-size:inherit;font-weight:650;text-align:left" data-cmd="person" data-id="${p.id}">${esc(p.name)}</button></h3><div class="aliases">${esc(short((p.aliases||[]).join(' / '),48))}</div></div></div><p class="identity">${esc(p.identity)}</p><div class="chips">${p.group?'<span class="chip blue">'+esc(p.group)+'</span>':''}${kindTag(p.layer)}${p.core?'<span class="chip">核心人物</span>':''}</div>${fate?`<div class="fate"><b>${esc(fate.label)}</b><br>${esc(short(fate.text,115))}</div>`:`<div class="fate"><b>档案状态</b><br>${esc(short(p.status||'按出现阶段记录，未将暂时下落推定为终局。',100))}</div>`}</article>`}
function renderCharacters(){let groups=uniq(D.characters.map(p=>p.group));let arr=D.characters.filter(p=>(state.filter==='all'||state.filter==='core'&&p.core||state.filter==='other'&&!p.core)&&(state.kind==='all'||p.group===state.kind)&&matches(p,state.query));setView(head('CHARACTER ARCHIVE','人物档案','本名、昵称和网名合并查找。核心人物提供性格证据、成长轨迹、关系变化与分层结局；配角保留其明确出场和作用。')+filterTabs([['all','全部人物'],['core','核心群像'],['other','配角与其他角色']])+filterInput('搜索本名、别名、性格或经历…',`<select data-select="kind" aria-label="人物分组">${selectOptions([['all','所有人物分组'],...groups.map(g=>[g,g])],state.kind)}</select>`)+`<div class="result-line"><span>找到 ${arr.length} 份人物档案</span><span>点击卡片，展开完整档案</span></div><div class="card-grid">${slicePage(arr,30).map(personCard).join('')||'<div class="empty">没有符合条件的人物。</div>'}</div>`+pagination(arr.length,30));bindSearch(renderCharacters)}
function renderFates(){let f=D.canon.fates;const otherFates=D.characters.filter(p=>!p.fate);setView(head('ENDINGS & ALTERNATE PATHS','结局与分支','把“正文发生了什么”“外传补充了什么”和“如果当时有另一种选择”分开读。所有结局均含剧透。')+`<div class="callout warn">${rich(D.canon.endingLead)}</div>`+section('正文与正式外传中的去向','“未交代”保留为未知，不自动补上圆满或悲惨结局')+`<div class="table-wrap panel" style="padding:0"><table class="table"><thead><tr><th>人物</th><th>确认的去向</th><th>理解这个结局的关键</th><th>来源</th></tr></thead><tbody>${f.map(x=>`<tr><td><button class="text-btn person-link" data-cmd="person-name" data-id="${esc(x.name)}">${esc(x.name)}</button><br><span class="chip ${x.tone||''}">${esc(x.label)}</span></td><td>${rich(x.text)}</td><td>${rich(x.note||'')}</td><td>${refs(x.refs,4)}</td></tr>`).join('')}</tbody></table></div>`+section('其他人物与群体的末次记录','没有明确终局的角色，保留其在所引文本中的最后状态')+`<details class="panel"><summary>展开其余 ${otherFates.length} 份档案的去向索引</summary><p class="citation-note">这里的“末次记录”不是替原书补完余生。前传、IF 和作者附录中的人物按各自叙事层理解；点击姓名查看全部分段证据。</p><div class="table-wrap"><table class="table"><thead><tr><th>角色 / 群体</th><th>原文可确认的末段状态</th><th>来源</th></tr></thead><tbody>${otherFates.map(p=>`<tr><td><button class="text-btn person-link" data-cmd="person" data-id="${p.id}">${esc(p.name)}</button><br>${kindTag(p.layer)}</td><td>${rich(p.status||'没有交代进一步去向，见所引出场。')}</td><td>${refs(p.statusRefs||p.refs.slice(-3),3)}</td></tr>`).join('')}</tbody></table></div></details>`+section('同一个人，不同的叙事结局','这里只比较原书明确提供的分支')+`<div class="two-col">${D.canon.alternatives.map(a=>`<article class="panel"><h3>${esc(a.name)}</h3><div class="event-detail" style="margin-top:15px"><span class="chip blue">正文 / 正式外传</span><p class="flow-text" style="margin-top:9px">${rich(a.canon)}</p></div><div style="margin-top:15px"><span class="chip gold">幸福假设 IF</span><p class="flow-text" style="margin-top:9px">${rich(a.alternate)}</p></div>${refs(a.refs,8)}</article>`).join('')}</div>`+section('梦、投影与来生','遇到“死而复生”或不可能的经历时，先确认发生在哪一层')+D.canon.layerCases.map(a=>`<article class="event-card" style="margin-bottom:13px"><div class="event-title"><h3>${esc(a.title)}</h3>${kindTag(a.layer)}</div><p class="flow-text">${rich(a.text)}</p>${refs(a.refs,8)}</article>`).join(''));}
function chapterRow(u){return `<article class="chapter-row"><div class="chapter-num">${u.kind==='main'?String(u.id).padStart(3,'0'):'+'+String(u.id).padStart(2,'0')}</div><div><div class="chapter-mini">${u.kind==='main'?'第 '+u.volume+' 卷':esc(kindNames[u.kind])} · PDF ${u.start}–${u.end} 页</div><h3><button class="text-btn" style="font-size:inherit;font-weight:600;text-align:left" data-cmd="ref" data-id="${u.key}">${esc(u.title)}</button></h3><p class="summary">${rich(u.summary)}</p>${u.turn?`<p class="turn"><span class="muted">推进与余波：</span>${esc(u.turn)}</p>`:''}${names(u.people)}</div><div class="chapter-actions">${star('chapter',u.key)}<button class="text-btn" data-cmd="ref" data-id="${u.key}">展开</button></div></article>`}
function renderChapters(){let arr=D.units.filter(u=>u.kind==='main'&&(state.volume==='all'||u.volume===+state.volume)&&matches(u,state.query));setView(head('665 CHAPTERS · COMPLETE INDEX','逐章精华','665 章逐章概括。每章记录发生的事、情节推进、出场人物、关联物品和对应 PDF 页码。')+filterInput('搜索章名、人物或本章情节…',`<select data-select="volume" aria-label="选择分卷">${selectOptions([['all','全部五卷'],...D.canon.volumes.map(v=>[String(v.id),'第'+v.id+'卷 · '+v.name])],state.volume)}</select>`)+`<div class="result-line"><span>找到 ${arr.length} 章 · 按正文顺序排列</span><span>摘要含本章结果</span></div><div class="chapter-list">${slicePage(arr,25).map(chapterRow).join('')||'<div class="empty">没有找到相应章节。</div>'}</div>`+pagination(arr.length,25));bindSearch(renderChapters)}
function renderExtras(){let arr=D.units.filter(u=>u.kind!=='main'&&(state.kind==='all'||u.kind===state.kind)&&matches(u,state.query));setView(head('BEYOND THE MAIN STORY','外传、番外与前传','补充文本共 79 个单元。正式外传、幸福假设、前传、作者元叙述与后记各有自己的阅读位置。')+`<div class="card-grid">${D.canon.extraGroups.map(x=>`<article class="layer-card"><div class="row"><span class="layer-no">${x.count}</span>${kindTag(x.kind)}</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><button class="text-btn" data-cmd="extra-kind" data-id="${x.kind}">只看这一组 →</button></article>`).join('')}</div>`+section('逐篇索引','编号“+”是图鉴补篇编号，保留原书篇名')+filterInput('搜索补篇标题、人物或情节…',`<select data-select="kind" aria-label="补篇类型">${selectOptions([['all','所有补充篇章'],...D.canon.extraGroups.map(x=>[x.kind,x.title])],state.kind)}</select>`)+`<div class="result-line">找到 ${arr.length} 个补充文本单元</div><div class="chapter-list">${slicePage(arr,20).map(chapterRow).join('')||'<div class="empty">没有符合条件的篇章。</div>'}</div>`+pagination(arr.length,20));bindSearch(renderExtras)}
function eventCard(e){return `<article class="event-card"><div class="event-title"><h3><button class="text-btn" style="font-size:inherit;font-weight:600;text-align:left" data-cmd="event" data-id="${e.id}">${esc(e.title)}</button></h3><div class="chips">${kindTag(e.layer)}<span class="chip ${/悲剧|失败/.test(e.status)?'red':''}">${esc(e.status||'阶段记录')}</span></div></div><div class="event-meta">${esc([e.scope,e.time,...(e.places||[])].filter(Boolean).join(' · '))}</div><p class="event-summary">${esc(e.cause)}</p><div class="event-result"><b>结 果</b><span>${rich(e.result)}</span></div><div class="event-actions"><div>${names(e.people)}${refs(e.refs,4)}</div><div class="row">${star('event',e.id)}<button class="text-btn" data-cmd="event" data-id="${e.id}">看前因后果 →</button></div></div></article>`}
function renderEvents(){let arr=D.events.filter(e=>(state.kind==='all'||e.layer===state.kind)&&(state.filter==='all'||state.filter==='tragic'&&/悲剧|死亡|失败|失去/.test([e.status,e.result].join(' '))||state.filter==='open'&&/持续|未交代|未决/.test([e.status,e.impact].join(' ')))&&matches(e,state.query));setView(head('EVENTS · CAUSES & CONSEQUENCES','事件档案','把散落在不同章节的同一件事连起来。每条记录都有起因、过程、结果、后续影响和回查入口。')+filterTabs([['all','全部事件'],['tragic','悲剧与失去'],['open','持续与未决']])+filterInput('搜索事件、人物、地点或结果…',`<select data-select="kind" aria-label="事件叙事层">${selectOptions([['all','全部叙事层'],...Object.entries(kindNames).filter(([k])=>D.events.some(e=>e.layer===k))],state.kind)}</select>`)+`<div class="result-line">找到 ${arr.length} 项事件 · 按原书首次证据位置排列</div><div class="event-list">${slicePage(arr,20).map(eventCard).join('')||'<div class="empty">没有符合条件的事件。</div>'}</div>`+pagination(arr.length,20));bindSearch(renderEvents)}
function objectCard(o){return `<article class="panel object-card"><div class="obj-head"><span class="chip blue">${esc(o.category)}</span>${star('object',o.id)}</div><h3><button class="text-btn" style="font-size:inherit;font-weight:600;text-align:left" data-cmd="object" data-id="${o.id}">${esc(o.name)}</button></h3>${o.aliases?.length?'<div class="small muted">'+esc(o.aliases.join(' / '))+'</div>':''}<p>${rich(short(o.story,250))}</p>${o.owners?.length?'<div style="margin-top:13px">'+names(o.owners)+'</div>':''}${o.meaning?'<div class="analysis"><span class="muted">文学解读：</span>'+esc(short(o.meaning,160))+'</div>':''}${refs(o.refs,5)}</article>`}
function renderObjects(){let categories=uniq(D.objects.map(o=>o.category));let arr=D.objects.filter(o=>(state.kind==='all'||o.category===state.kind)&&matches(o,state.query));setView(head('OBJECTS · MEMORY & SYMBOLS','物品与意象','不仅记录“出现了什么”，也追踪谁拥有它、它如何流转、带来什么后果。象征意义单独标为文学解读。')+`<div class="callout">${rich(D.canon.objectLead||'一朵勿忘我、一半贝壳、一封信、一张占卜卡，都可能把远隔多章的故事连在一起。宠物也另有角色档案；这里集中追踪它们在生活与记忆中的作用。')}</div>`+filterInput('搜索物品、拥有者或剧情作用…',`<select data-select="kind" aria-label="物品分类">${selectOptions([['all','所有类别'],...categories.map(c=>[c,c])],state.kind)}</select>`)+`<div class="result-line">找到 ${arr.length} 项 · 常见用品按剧情作用适当合并</div>${state.kind==='药物'?'<p class="citation-note">药物条目只描述原著的叙事用途，不提供剂量、使用方法或医疗建议。原书前言也明确提示药物内容包含虚构。</p>':''}<div class="card-grid">${slicePage(arr,24).map(objectCard).join('')||'<div class="empty">没有找到对应物品。</div>'}</div>`+pagination(arr.length,24));bindSearch(renderObjects)}
function renderTimeline(){let modes=[['story','故事年代'],['order','叙述顺序'],['process','人物过程线']];let html=head('TIME & CHARACTER JOURNEYS','时间与过程线','绝对年份以原文为准；没有明确日期的事件用阶段排序。梦境与跨时空外传单列，原著内部矛盾也保留下来。')+filterTabs(modes,'timelineMode');if(state.timelineMode==='story'){html+=`<div class="callout" style="margin-top:20px">${rich(D.canon.timelineNote)}</div><div class="date-timeline">`+D.canon.timeline.map(t=>`<div class="time-group"><div class="time-label">${esc(t.label)}<br><span class="small muted">${esc(t.certainty||'原文明确')}</span></div><div class="time-items">${t.items.map(i=>`<article class="panel"><h3>${esc(i.title)}</h3><p>${rich(i.text)}</p>${refs(i.refs,8)}</article>`).join('')}</div></div>`).join('')+'</div>'+section('原书中的其他时间锚点','供精读校验；保留“明确 / 相对 / 推断”标记')+`<details class="panel"><summary>展开 ${D.timeAnchors.length} 条逐段时间记录</summary><div class="table-wrap" style="margin-top:15px"><table class="table"><thead><tr><th>时间表述</th><th>对应事件</th><th>证据</th></tr></thead><tbody>${D.timeAnchors.map(t=>`<tr><td>${esc(t.label)}<br><span class="chip">${esc(t.certainty)}</span>${kindTag(t.layer)}</td><td>${esc(t.what)}</td><td>${refs(t.refs,3)}</td></tr>`).join('')}</tbody></table></div></details>`;}else if(state.timelineMode==='order'){html+=`<p class="citation-note">按读者实际遇见的顺序排列。插叙、梦境和附录放回各自的叙述位置，不强行换算成同一条现实时间轴。</p>`+D.arcs.map((a,i)=>`<article class="story-block"><aside class="story-side"><strong>${String(i+1).padStart(2,'0')}</strong>${kindTag(a.layer)}</aside><div class="story-copy"><h3>${esc(a.title)}</h3><p>${rich(a.summary)}</p>${refs(a.refs,8)}</div></article>`).join('');}else{html+=D.canon.processes.map(p=>section(p.name,p.description)+`<div class="process-line">${p.steps.map((s,i)=>`<article class="process-step"><strong>阶段 ${i+1}</strong><h3>${esc(s.title)}</h3><p>${rich(s.text)}</p>${refs(s.refs,4)}</article>`).join('')}</div>`).join('');}setView(html)}
function placeCard(p){return `<article class="panel place-card"><h3><button class="text-btn" style="font-size:inherit;font-weight:600;text-align:left" data-cmd="place" data-id="${p.id}">${esc(p.name)}</button></h3><p>${rich(short(p.description,220))}</p>${names(p.people)}${refs(p.refs,4)}</article>`}
function findPlace(n){return D.places.find(p=>p.name===n||p.aliases?.includes(n))||D.places.find(p=>p.name.includes(n))}
function renderPlaces(){let arr=D.places.filter(p=>matches(p,state.query));let regions=D.canon.mapRegions;setView(head('A SCHEMATIC STORY MAP','故事地图','按故事中的生活空间与迁移路线组织。这里是叙事地图，不是现实导航地图；不为“小城市”等匿名地点杜撰地理坐标。')+`<div class="callout">${rich(D.canon.mapNote)}</div><div class="map-schematic">${regions.map(r=>`<section class="map-region"><div class="eyebrow">${esc(r.label)}</div><h3 class="serif">${esc(r.title)}</h3><p>${esc(r.text)}</p>${r.places.map(n=>{let p=findPlace(n);return `<button class="place-stop" data-cmd="${p?'place':'search'}" data-id="${esc(p?p.id:n)}">${esc(n)} <span style="float:right">↗</span></button>`}).join('')}</section>`).join('')}</div>`+section('人物迁移与相遇路线','箭头只表达发生顺序，不表达方向或距离')+D.canon.journeys.map(j=>`<details class="panel" style="margin-bottom:13px" ${j.primary?'open':''}><summary><strong>${esc(j.name)}</strong><span class="small muted"> · ${esc(j.description)}</span></summary><div class="process-line">${j.steps.map((s,i)=>`<article class="process-step"><strong>停靠 ${i+1}</strong><h3>${esc(s.place)}</h3><p>${rich(s.text)}</p>${refs(s.refs,4)}</article>`).join('')}</div></details>`).join('')+section('全部地点索引','包括生活、工作、旅行、梦境与外传空间')+filterInput('搜索地点或发生过的事件…')+`<div class="result-line">找到 ${arr.length} 个地点条目</div><div class="card-grid">${slicePage(arr,24).map(placeCard).join('')}</div>`+pagination(arr.length,24));bindSearch(renderPlaces)}

function getSearchIndex(){if(searchIndex)return searchIndex;searchIndex=[...TOPICS.map(t=>({type:'topic',id:t.id,title:t.title,tag:t.tag,body:t.body})),...D.characters.map(p=>({type:'person',id:p.id,title:p.name,tag:'人物',body:[p.aliases.join(' '),p.identity,p.traits?.join(' '),p.fate?.text,p.fate?.note,p.portrait,p.status,...p.segments.map(s=>s.arc+' '+s.segmentFate)].join(' ')})),...D.events.map(e=>({type:'event',id:e.id,title:e.title,tag:'事件',body:[e.people.join(' '),e.cause,e.course,e.result,e.impact].join(' ')})),...D.objects.map(o=>({type:'object',id:o.id,title:o.name,tag:'物品与意象',body:[o.aliases.join(' '),o.owners.join(' '),o.story,o.meaning].join(' ')})),...D.places.map(p=>({type:'place',id:p.id,title:p.name,tag:'地点',body:p.aliases.join(' ')+' '+p.description+' '+p.events.join(' ')})),...D.units.map(u=>({type:'chapter',id:u.key,title:(u.kind==='main'?'第'+u.id+'章 · ':'')+u.title,tag:kindNames[u.kind],body:u.summary+' '+u.turn+' '+u.people.join(' ')+' '+u.objects.join(' ')+' '+u.places.join(' ')}))];return searchIndex;}
function highlighted(s,q){if(!q)return esc(s);let at=s.toLowerCase().indexOf(q.toLowerCase());if(at<0)return esc(s);return esc(s.slice(0,at))+'<mark>'+esc(s.slice(at,at+q.length))+'</mark>'+esc(s.slice(at+q.length));}
function excerpt(s,q){let at=s.toLowerCase().indexOf(q.toLowerCase());let start=Math.max(0,at-60);return (start?'…':'')+s.slice(start,start+230)+(start+230<s.length?'…':'')}
function renderSearch(){let q=state.query.trim();$('#global-search').value=q;let all=q?getSearchIndex().filter(x=>(x.title+' '+x.body).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.title.includes(q)?1:0)-(a.title.includes(q)?1:0)):[];let types=uniq(all.map(x=>x.type));let arr=all.filter(x=>state.filter==='all'||state.filter===x.type);setView(head('SEARCH THE WHOLE ATLAS','全书搜索',q?'“'+q+'”的匹配结果；可直接进入人物、事件、物品、地点或对应章节。':'在顶部输入任何人物、物品、章名或剧情词语。')+(q?filterTabs([['all','全部 '+all.length],...types.map(t=>[t,({person:'人物',event:'事件',object:'物品',place:'地点',chapter:'章节',topic:'专题'})[t]+' '+all.filter(x=>x.type===t).length])])+`<div class="result-line">共 ${arr.length} 项匹配</div>`+slicePage(arr,25).map(x=>`<article class="search-hit"><span class="chip blue">${x.tag}</span><h3><button class="text-btn" style="font-size:inherit;font-weight:600;text-align:left" data-cmd="${x.type==='chapter'?'ref':x.type}" data-id="${esc(x.id)}">${highlighted(x.title,q)}</button></h3><p>${highlighted(excerpt(x.body,q),q)}</p></article>`).join('')+(arr.length?pagination(arr.length,25):'<div class="empty">未找到匹配。可以尝试人物的简称、物品名，或更短的关键词。</div>'):`<div class="row">${['苏雨晴','林夕晨','莫空','贝壳','占卜卡','来生','轮回'].map(s=>btn('search',s,s)).join('')}</div>`));}
function showDialog(title,eyebrow,html,type,id){state.detail={type,id};$('#detail-title').textContent=title;$('#detail-eyebrow').textContent=eyebrow;$('#detail-body').innerHTML=html+noteBox(type,id);let d=$('#detail-dialog');if(!d.open)d.showModal();d.scrollTop=0;$('#detail-title').focus({preventScroll:true});const ta=$('#detail-note');if(ta){ta.addEventListener('input',()=>{state.notes[type+':'+id]=ta.value;const saved=store.set('notes',state.notes);$('#note-status').textContent=saved?'已在本地保存':'本次修改尚未持久保存，请在“我的收藏”中导出备份'});} }
function noteBox(type,id){if(!type||!id)return '';const k=type+':'+id;return `<hr class="rule"><div class="row" style="justify-content:space-between"><h3 style="margin:0">我的阅读批注</h3>${star(type,id)}</div><label class="note-label" for="detail-note">可记下自己的理解、疑问或想回看的细节。</label><textarea id="detail-note" class="note-area" placeholder="在这里写下笔记…">${esc(state.notes[k]||'')}</textarea><div class="small muted" id="note-status">仅保存在本地浏览器，可在“我的收藏”中导出。</div>`;}
function openPerson(id){const p=PN.get(id);if(!p)return;let rs=neighbors(p.name);let apps=D.units.filter(u=>u.people.includes(p.name));showDialog(p.name,`${p.group||'人物档案'} · ${kindNames[p.layer]||'跨篇人物'}`,`<div class="row">${p.aliases?.length?'<span class="small muted">别名：'+esc(p.aliases.join(' / '))+'</span>':''}<button class="text-btn" data-cmd="person-graph" data-id="${esc(p.name)}">查看关系图 →</button></div><p class="flow-text" style="margin-top:15px">${rich(p.identity)}</p>${p.fate?`<h3>确认的结局</h3><div class="callout"><strong>${esc(p.fate.label)}</strong><p style="margin-top:6px">${rich(p.fate.text)}</p>${p.fate.note?'<p class="small muted" style="margin-top:8px">'+rich(p.fate.note)+'</p>':''}${refs(p.fate.refs,12)}</div>`:''}<h3>性格刻画与行动证据</h3><ul class="trait-list">${p.traits.map(t=>'<li>'+rich(t)+'</li>').join('')}</ul>${p.portrait?'<p class="flow-text">'+rich(p.portrait)+'</p>':''}<h3>经历与变化</h3>${p.segments.map(s=>`<section class="segment"><h4>${esc(s.scope)} ${kindTag(s.layer)}</h4><p>${rich(s.arc)}</p><p style="margin-top:9px"><strong>截至该段：</strong>${rich(s.segmentFate)}</p>${refs(s.refs,12)}</section>`).join('')}${rs.length?'<h3>人物关系</h3>'+rs.map(r=>`<div class="neighbor"><h4><button class="text-btn" data-cmd="person-name" data-id="${esc(r.other)}">${esc(r.other)}</button> <span class="chip">${esc(r.type)}</span></h4><p>${rich(r.detail)}</p>${refs(r.refs,6)}</div>`).join(''):''}<h3>关联出场索引</h3><p class="small muted">${apps.length} 个摘要明确登记了该人物的出场或关键提及；检索原名可查看更多间接关联。</p>${refs(apps.map(u=>u.key),70)}${apps.length>70?btn('person-search','搜索更多关联',p.name):''}`, 'person',p.id);}
function openTopic(id){const t=T.get(id);if(!t)return;showDialog(t.title,t.tag,'<p class="flow-text">'+rich(t.body)+'</p>'+refs(t.refs,40),'topic',t.id)}
function openEvent(id){let e=E.get(id);if(!e)return;showDialog(e.title,'事件档案 · '+(kindNames[e.layer]||'正文')+' · '+e.scope,`<div class="row">${kindTag(e.layer)}<span class="chip">${esc(e.status||'阶段记录')}</span><span class="small muted">${esc(e.time||'原文未给出精确日期')}</span></div><div style="margin-top:12px">${names(e.people)}</div>${['cause','course','result','impact'].map((k,i)=>`<div class="event-detail"><b>${['起因','过程','结果','后续影响'][i]}</b><div>${rich(e[k]||'原文在所引段落中未交代。')}</div></div>`).join('')}<h3>发生地点</h3><p>${esc(e.places.join(' / ')||'所引段落未明确命名')}</p><h3>对应章节</h3>${refs(e.refs,50)}`, 'event',e.id)}
function openObject(id){let o=O.get(id);if(!o)return;showDialog(o.name,'物品档案 · '+o.category,`<div class="chips"><span class="chip blue">${esc(o.category)}</span>${kindTag(o.layer)}</div>${o.aliases?.length?'<p class="small muted">别称：'+esc(o.aliases.join(' / '))+'</p>':''}<h3>关联人物</h3>${names(o.owners)}<h3>出现、流转与去向</h3><p class="flow-text">${rich(o.story)}</p>${o.segments?.length>1?'<h3>分段记录</h3>'+o.segments.map(s=>`<div class="segment"><h4>${esc(s.scope)} ${kindTag(s.layer)}</h4><p>${rich(s.story)}</p>${refs(s.refs,8)}</div>`).join(''):''}${o.caveat?'<h3>跨章核对提醒</h3><div class="callout">'+rich(o.caveat)+refs(o.caveatRefs,8)+'</div>':''}${o.meaning?'<h3>文学解读</h3><div class="callout">'+rich(o.meaning)+'</div>':''}<h3>来源</h3>${refs(o.refs,50)}`, 'object',o.id)}
function openPlace(id){let p=L.get(id);if(!p)return;showDialog(p.name,'故事地点 · '+(kindNames[p.layer]||'叙事空间'),`<p class="flow-text">${rich(p.description)}</p>${p.aliases?.length?'<p class="small muted">其他称呼：'+esc(p.aliases.join(' / '))+'</p>':''}<h3>这里发生过什么</h3><ul class="trait-list">${p.events.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h3>相关人物</h3>${names(p.people)}<h3>来源</h3>${refs(p.refs,50)}<p class="citation-note">地点说明只使用原著已给出的信息；概念地图不代表现实坐标。</p>`, 'place',p.id)}
function openUnit(key){let u=U.get(key);if(!u)return;let same=D.units.filter(x=>x.kind===u.kind);let index=same.indexOf(u);let events=D.events.filter(e=>e.refs.includes(key));let objects=D.objects.filter(o=>o.refs.includes(key));let caveats=D.canon.ambiguities.filter(a=>a.refs.includes(key));showDialog((u.kind==='main'?'第'+u.id+'章 · ':'')+u.title,kindNames[u.kind]+' · PDF '+u.start+'–'+u.end+' 页',`<div class="row">${kindTag(u.kind)}<span class="small muted">${u.kind==='main'?'第 '+u.volume+' 卷 · ':''}原书 PDF 第 ${u.start}–${u.end} 页</span></div><h3>本章精华</h3><p class="flow-text">${rich(u.summary)}</p>${u.turn?'<h3>推进与余波</h3><div class="callout">'+rich(u.turn)+'</div>':''}${caveats.length?'<h3>跨章核对提醒</h3>'+caveats.map(a=>'<div class="callout" style="margin-bottom:10px"><strong>'+esc(a.title)+'</strong><p style="margin-top:8px">'+rich(a.text)+'</p>'+refs(a.refs,8)+'</div>').join(''):''}${u.time?'<p class="citation-note">时间线索：'+esc(u.time)+'</p>':''}<h3>人物</h3>${names(u.people)}${u.objects.length?'<h3>物品与线索</h3><p>'+esc(u.objects.join(' / '))+'</p>':''}${u.places.length?'<h3>地点</h3><p>'+esc(u.places.join(' / '))+'</p>':''}${events.length?'<h3>关联事件</h3>'+events.map(e=>'<div><button class="text-btn" data-cmd="event" data-id="'+e.id+'">'+esc(e.title)+' →</button></div>').join(''):''}${objects.length?'<h3>关联物品档案</h3><div class="chips">'+objects.map(o=>'<button class="chip" data-cmd="object" data-id="'+o.id+'">'+esc(o.name)+'</button>').join('')+'</div>':''}<h3>回查原书</h3><div class="row">${btn('pdf','打开原书 p.'+u.start,String(u.start))}<span class="small muted">${state.pdfURL?'使用已选择的本地PDF':'首次回查请在“来源与使用”中选择本地PDF'}</span></div><hr class="rule"><div class="row" style="justify-content:space-between">${index>0?btn('ref','← 上一篇',same[index-1].key):'<span></span>'}${index<same.length-1?btn('ref','下一篇 →',same[index+1].key):''}</div>`, 'chapter',u.key)}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function syncMenuAccessibility(){const side=$('#sidebar');const hidden=window.innerWidth<=760&&!side.classList.contains('open');side.inert=hidden;if(hidden)side.setAttribute('aria-hidden','true');else side.removeAttribute('aria-hidden')}
function closeMenu(){let wasOpen=$('#sidebar').classList.contains('open');$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');syncMenuAccessibility();if(wasOpen)$('#menu-toggle').focus()}
function closeDialog(){if($('#detail-dialog').open)$('#detail-dialog').close();state.detail=null;if(state.route==='notebook')renderNotebook();}
function changeStar(type,id){let k=type+':'+id;if(state.bookmarks.includes(k))state.bookmarks=state.bookmarks.filter(x=>x!==k);else state.bookmarks.push(k);store.set('bookmarks',state.bookmarks);$$(`[data-cmd="star"]`).filter(e=>e.dataset.type===type&&e.dataset.id===id).forEach(e=>{let on=state.bookmarks.includes(k);e.classList.toggle('on',on);e.textContent=on?'★':'☆';e.setAttribute('aria-pressed',on);e.setAttribute('aria-label',on?'取消收藏':'收藏')});if(state.route==='notebook'&&!$('#detail-dialog').open)renderNotebook();}
document.addEventListener('click',e=>{let b=e.target.closest('[data-cmd]');if(!b)return;let {cmd,id,type,field}=b.dataset;if(cmd==='star'){e.stopPropagation();changeStar(type,id);return}if(cmd==='nav'){navigate(id);return}if(cmd==='ref')openUnit(id);if(cmd==='person')openPerson(id);if(cmd==='person-name'){let p=P.get(id);if(p)openPerson(p.id);else{closeDialog();navigate('search',{query:id})}}if(cmd==='topic')openTopic(id);if(cmd==='event')openEvent(id);if(cmd==='object')openObject(id);if(cmd==='place')openPlace(id);if(cmd==='volume'){navigate('chapters',{volume:id});}if(cmd==='filter'){state[field||'filter']=id;state.page=1;pages[state.route]();}if(cmd==='page'){state.page=Math.max(1,+id);pages[state.route]();window.scrollTo({top:0,behavior:'instant'});}if(cmd==='extra-kind'){state.kind=id;state.page=1;renderExtras();$('#local-search')?.scrollIntoView({block:'center'});}if(cmd==='graph-mode'){state.graphMode=id;renderRelations();}if(cmd==='graph-focus'){if(P.has(id)){state.graphFocus=id;state.graphMode='focus';renderRelations();}else navigate('search',{query:id});}if(cmd==='person-graph'){closeDialog();navigate('relations',{graphFocus:id,graphMode:'focus'});}if(cmd==='person-search'||cmd==='search'){closeDialog();navigate('search',{query:id});}if(cmd==='pdf'){if(state.pdfURL){let a=document.createElement('a');a.href=state.pdfURL+'#page='+Number(id);a.target='_blank';a.rel='noopener';a.click();}else{closeDialog();navigate('sources');$('#source-pdf').scrollIntoView({block:'center'});toast('请选择本地原书PDF，即可跳到对应页。')}}if(cmd==='export-notes'){let blob=new Blob([JSON.stringify({format:'transky-atlas-notes-v1',exportedAt:new Date().toISOString(),bookmarks:state.bookmarks,notes:state.notes},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='天空图鉴-我的阅读笔记.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}if(cmd==='import-notes')$('#notes-file')?.click();});

document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){e.preventDefault();$('#global-search').focus();}if(e.key==='Escape')closeMenu();});
